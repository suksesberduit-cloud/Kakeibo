name: Deploy PWA & Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1) Deploy the PWA (index.html, manifest, sw.js, css/js/icons) to
  #    GitHub Pages. Bubblewrap needs a *live* HTTPS URL to package.
  # ---------------------------------------------------------------------
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.
